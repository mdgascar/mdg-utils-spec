# Malagasy calendar names and date patterns (Gregorian calendar). Rules in README.md.
months:
  - { number: 1, name: Janoary, abbreviation: Jan }
  - { number: 2, name: Febroary, abbreviation: Feb }
  - { number: 3, name: Martsa, abbreviation: Mar }
  - { number: 4, name: Aprily, abbreviation: Apr }
  - { number: 5, name: Mey, abbreviation: Mey }
  - { number: 6, name: Jona, abbreviation: Jon }
  - { number: 7, name: Jolay, abbreviation: Jol }
  - { number: 8, name: Aogositra, abbreviation: Aog }
  - { number: 9, name: Septambra, abbreviation: Sep }
  - { number: 10, name: Oktobra, abbreviation: Okt }
  - { number: 11, name: Novambra, abbreviation: Nov }
  - { number: 12, name: Desambra, abbreviation: Des }
monthsSource:
  source: https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-dates-full/main/mg/ca-gregorian.json
  checked: 2026-11-24
# ISO 8601 weekday numbers: Monday is 1, Sunday is 7.
weekdays:
  - { isoNumber: 1, name: Alatsinainy, abbreviation: Alats }
  - { isoNumber: 2, name: Talata, abbreviation: Tal }
  - { isoNumber: 3, name: Alarobia, abbreviation: Alar }
  - { isoNumber: 4, name: Alakamisy, abbreviation: Alak }
  - { isoNumber: 5, name: Zoma, abbreviation: Zom }
  - { isoNumber: 6, name: Asabotsy, abbreviation: Asab }
  - { isoNumber: 7, name: Alahady, abbreviation: Alah }
weekdaysSource:
  source: https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-dates-full/main/mg/ca-gregorian.json
  checked: 2026-11-24
# CLDR date patterns (EEEE weekday, d/dd day, MMMM/MMM/MM month, y year).
# The first style is the default.
styles:
  - id: long
    pattern: d MMMM y
    source: https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-dates-full/main/mg/ca-gregorian.json
    checked: 2026-11-24
  - id: full
    pattern: EEEE d MMMM y
    source: https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-dates-full/main/mg/ca-gregorian.json
    checked: 2026-11-24
  - id: medium
    pattern: y MMM d
    source: https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-dates-full/main/mg/ca-gregorian.json
    checked: 2026-11-24
  - id: short
    pattern: y-MM-dd
    source: https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-dates-full/main/mg/ca-gregorian.json
    checked: 2026-11-24
  - id: numeric
    pattern: dd/MM/y
    source: https://github.com/mdgascar/mdg-utils-spec/blob/dev/modules/date/README.md#recorded-decisions
    checked: 2026-11-24
# Telling the time (rule 7): 'amin'ny', the hour on a 12-hour clock in words, the minutes, then
# the part of the day. 2:30 → 'amin'ny roa sy sasany', 2:45 → 'amin'ny telo latsaka fahefany'.
time:
  prefix: "amin'ny"
  after: sy
  before: latsaka
  more: mahery
  source: https://www.wildmadagascar.org/people/malagasy-time.html
  checked: 2026-11-27
# Minutes with their own word; every other minute is counted in words (rule 7).
# 15 and 30: the phrasebook (Rasoloson, Hippocrene). 20 and 40: maintainer decision.
fractions:
  - { minutes: 15, word: fahefany }
  - { minutes: 20, word: fahatelony }
  - { minutes: 30, word: sasany }
fractionsSource:
  source: https://www.wildmadagascar.org/people/malagasy-time.html
  checked: 2026-11-27
# Parts of the day, by the hour (0–23) the time names, as in French: matin, midi,
# après-midi, soir; minuit is the night. Names: Peace Corps Madagascar, Malagasy lessons.
# Ranges: maintainer decision (2026-11-27).
dayParts:
  - { from: 0, to: 0, word: alina }
  - { from: 1, to: 11, word: maraina }
  - { from: 12, to: 12, word: atoandro }
  - { from: 13, to: 17, word: tolakandro }
  - { from: 18, to: 23, word: hariva }
dayPartsSource:
  source: https://files.peacecorps.gov/multimedia/audio/languagelessons/madagascar/MG_Malagasy_Language_Lessons.pdf
  checked: 2026-11-27
# maxReadLength: longest text parseDate reads, so a parser never scans unbounded input. The
# longest formatted date, 'Alatsinainy 23 Septambra 2026', has 30 characters.
limits:
  minYear: 1
  maxYear: 9999
  maxReadLength: 64
  # Longest text parseTime reads (the longest spellTime phrase is about 70 characters).
  maxTimeReadLength: 128
