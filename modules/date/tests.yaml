- fn: weekdayName
  input: 0
  error: OUT_OF_RANGE
- fn: weekdayName
  input: 8
  error: OUT_OF_RANGE
# parseDate: Malagasy dates back to calendar fields, in any style formatDate writes.
- fn: parseDate
  input: '23 Novambra 2026'
  expected: { year: 2026, month: 11, day: 23 }
  note: 'long'
- fn: parseDate
  input: 'Alatsinainy 23 Novambra 2026'
  expected: { year: 2026, month: 11, day: 23 }
  note: 'full'
- fn: parseDate
  input: '2026 Nov 23'
  expected: { year: 2026, month: 11, day: 23 }
  note: 'medium'
- fn: parseDate
  input: '2026-11-23'
  expected: { year: 2026, month: 11, day: 23 }
  note: 'short'
- fn: parseDate
  input: '23/11/2026'
  expected: { year: 2026, month: 11, day: 23 }
  note: 'numeric'
- fn: parseDate
  input: '26 Jona 1960'
  expected: { year: 1960, month: 6, day: 26 }
- fn: parseDate
  input: '5/7/2026'
  expected: { year: 2026, month: 7, day: 5 }
  note: 'one-digit day and month, as people type them'
- fn: parseDate
  input: '  23 novambra   2026 '
  expected: { year: 2026, month: 11, day: 23 }
  note: 'case and spacing do not matter'
- fn: parseDate
  input: '1 Janoary 1'
  expected: { year: 1, month: 1, day: 1 }
  note: 'smallest year, as formatDate writes it'
- fn: parseDate
  input: '23/11/2026'
  args: ['numeric']
  expected: { year: 2026, month: 11, day: 23 }
  note: 'a style restricts the reading to that style'
- fn: parseDate
  input: '23 Novambra 2026'
  args: ['numeric']
  error: INVALID_FORMAT
- fn: parseDate
  input: 'Talata 23 Novambra 2026'
  error: INVALID_FORMAT
  note: '23 November 2026 is an Alatsinainy: the weekday must match'
- fn: parseDate
  input: '30 Febroary 2026'
  error: INVALID_FORMAT
  note: 'impossible date'
- fn: parseDate
  input: '29/02/2023'
  error: INVALID_FORMAT
  note: 'not a leap year'
- fn: parseDate
  input: '1 Janoary 0'
  error: OUT_OF_RANGE
  note: 'years 1 to 9999'
- fn: parseDate
  input: '23 November 2026'
  error: INVALID_FORMAT
  note: 'English month name'
- fn: parseDate
  input: '11/23/2026'
  error: INVALID_FORMAT
  note: 'day first: there is no month 23'
- fn: parseDate
  input: ''
  error: INVALID_FORMAT
- fn: parseDate
  input: '23 Novambra 2026 2026 2026 2026 2026 2026 2026 2026 2026 2026 2026'
  error: INVALID_FORMAT
  note: 'longer than limits.maxReadLength'
- fn: parseDate
  input: 20261123
  error: INVALID_TYPE
- fn: parseDate
  input: '23/11/2026'
  args: ['weekly']
  error: INVALID_TYPE
- fn: parseDate
  input: '5 Mey 12'
  error: AMBIGUOUS
  note: "'Mey' is the month name and its abbreviation: 5 May 12 (long) or 12 May 5 (medium)"
- fn: parseDate
  input: '5 Mey 12'
  args: ['long']
  expected: { year: 12, month: 5, day: 5 }
# spellTime (rule 7): a time of day said in Malagasy.
- fn: spellTime
  input: '14:00'
  expected: "amin'ny roa tolakandro"
- fn: spellTime
  input: '02:00'
  expected: "amin'ny roa maraina"
  note: "phrasebook: 'Amin'ny roa'"
- fn: spellTime
  input: '02:05'
  expected: "amin'ny roa sy dimy maraina"
  note: "phrasebook: 'Amin'ny roa sy dimy'"
- fn: spellTime
  input: '02:10'
  expected: "amin'ny roa sy folo maraina"
- fn: spellTime
  input: '02:15'
  expected: "amin'ny roa sy fahefany maraina"
- fn: spellTime
  input: '02:20'
  expected: "amin'ny roa sy fahatelony maraina"
- fn: spellTime
  input: '02:25'
  expected: "amin'ny roa sy sasany latsaka dimy maraina"
- fn: spellTime
  input: '02:30'
  expected: "amin'ny roa sy sasany maraina"
  note: "phrasebook: 'Amin'ny roa sy sasany'"
- fn: spellTime
  input: '02:35'
  expected: "amin'ny roa sy sasany mahery dimy maraina"
- fn: spellTime
  input: '02:40'
  expected: "amin'ny telo latsaka fahatelony maraina"
- fn: spellTime
  input: '02:45'
  expected: "amin'ny telo latsaka fahefany maraina"
  note: "phrasebook: 'Amin'ny telo latsaka fahefany'"
- fn: spellTime
  input: '02:50'
  expected: "amin'ny telo latsaka folo maraina"
- fn: spellTime
  input: '02:55'
  expected: "amin'ny telo latsaka dimy maraina"
  note: "phrasebook: 'Amin'ny telo latsaka dimy'"
- fn: spellTime
  input: '10:00'
  expected: "amin'ny folo maraina"
  note: "dictionary entry maraina: 'Amin' ny folo maraina'"
- fn: spellTime
  input: '17:00'
  expected: "amin'ny dimy tolakandro"
- fn: spellTime
  input: '18:15'
  expected: "amin'ny enina sy fahefany hariva"
- fn: spellTime
  input: '12:00'
  expected: "amin'ny roa ambin'ny folo atoandro"
- fn: spellTime
  input: '11:45'
  expected: "amin'ny roa ambin'ny folo latsaka fahefany atoandro"
  note: 'the part of the day follows the hour the time names'
- fn: spellTime
  input: '00:00'
  expected: "amin'ny roa ambin'ny folo alina"
- fn: spellTime
  input: '23:45'
  expected: "amin'ny roa ambin'ny folo latsaka fahefany alina"
- fn: spellTime
  input: '13:07'
  expected: "amin'ny iray sy fito tolakandro"
  note: 'other minutes are counted'
- fn: spellTime
  input: { hour: 21, minute: 30 }
  expected: "amin'ny sivy sy sasany hariva"
- fn: spellTime
  input: '7:05'
  expected: "amin'ny fito sy dimy maraina"
  note: 'a one-digit hour'
- fn: spellTime
  input: '24:00'
  error: INVALID_FORMAT
- fn: spellTime
  input: '14h30'
  error: INVALID_FORMAT
- fn: spellTime
  input: { hour: 24, minute: 0 }
  error: OUT_OF_RANGE
- fn: spellTime
  input: { hour: 1.5, minute: 0 }
  error: INVALID_TYPE
- fn: spellTime
  input: 1430
  error: INVALID_TYPE
# parseTime: the words back into hour and minute.
- fn: parseTime
  input: "amin'ny roa sy sasany tolakandro"
  expected: { hour: 14, minute: 30 }
- fn: parseTime
  input: "Amin'ny  telo latsaka fahefany maraina"
  expected: { hour: 2, minute: 45 }
  note: 'case and spacing do not matter'
- fn: parseTime
  input: 'fito maraina'
  expected: { hour: 7, minute: 0 }
  note: "amin'ny may be left out"
- fn: parseTime
  input: "amin'ny roa ambin'ny folo alina"
  expected: { hour: 0, minute: 0 }
- fn: parseTime
  input: "amin'ny roa sy sasany"
  error: INVALID_FORMAT
  note: 'the part of the day is needed: 2:30 or 14:30'
- fn: parseTime
  input: 'two thirty'
  error: INVALID_FORMAT
- fn: parseTime
  input: 230
  error: INVALID_TYPE
